name: Build

# Pull requests build the App image without pushing. Pushes to main build and
# push ghcr.io/<owner>/{arch}-addon-praktor:<version> (from praktor/config.yaml),
# skipping versions that already exist.

on:
  push:
    branches: [main]
    paths: ["praktor/**", ".github/workflows/build.yaml"]
  pull_request:
    paths: ["praktor/**", ".github/workflows/build.yaml"]
  workflow_dispatch:

env:
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: addon-praktor

permissions:
  contents: read

jobs:
  init:
    name: Initialize build
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      version: ${{ steps.info.outputs.version }}
      praktor_version: ${{ steps.info.outputs.praktor_version }}
      base_tag: ${{ steps.info.outputs.base_tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Read App info
        id: info
        run: |
          echo "version=$(yq -r .version praktor/config.yaml)" >> "$GITHUB_OUTPUT"
          echo "praktor_version=$(yq -r .args.PRAKTOR_VERSION praktor/build.yaml)" >> "$GITHUB_OUTPUT"
          echo "base_tag=$(yq -r .build_from.amd64 praktor/build.yaml | cut -d: -f2)" >> "$GITHUB_OUTPUT"

      - name: Get build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}

  build:
    name: Build ${{ matrix.arch }} image
    needs: init
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write # Cosign signing
      packages: write # push to GHCR
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          context: praktor
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base:${{ needs.init.outputs.base_tag }}
            PRAKTOR_VERSION=${{ needs.init.outputs.praktor_version }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image: ${{ matrix.image }}
          image-tags: |
            ${{ needs.init.outputs.version }}
          push: ${{ github.event_name != 'pull_request' }}
          skip-existing: ${{ needs.init.outputs.version }}
          version: ${{ needs.init.outputs.version }}
