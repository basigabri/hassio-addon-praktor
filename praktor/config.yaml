name: "Praktor"
description: "Personal multi-agent AI assistant: Claude Code agents in isolated containers, reachable from Telegram and Home Assistant Assist."
url: "https://github.com/basigabri/hassio-addon-praktor/tree/main/praktor"
version: "0.9.12-ha.1"
slug: "praktor"
init: false
arch:
  - aarch64
  - amd64
# Praktor starts one Docker container per agent, so it needs the Docker API.
# This only works with "Protection mode" turned off (see DOCS.md).
docker_api: true
map:
  - addon_config:rw
# Not published by default: Home Assistant reaches Praktor over the internal
# network. Set a port on the Network tab to open Mission Control on your LAN.
ports:
  8080/tcp: null
ports_description:
  8080/tcp: "Mission Control web UI and API (LAN)"
options:
  telegram_token: ""
  allowed_telegram_users: []
  web_password: ""
  chat_token: ""
  vault_passphrase: ""
  timezone: "UTC"
schema:
  telegram_token: password
  allowed_telegram_users:
    - int
  web_password: password
  chat_token: password?
  vault_passphrase: password
  timezone: str
image: "ghcr.io/basigabri/{arch}-addon-praktor"
